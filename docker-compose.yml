# Shared fragments. `x-` keys are ignored by Docker and exist only to be
# anchored into the services below.

# ONE build definition for both app services, and that is the point.
#
# `relay` and `worker` run the same image from the same Dockerfile. If their
# build blocks drift by so much as one arg, Docker computes a different cache
# key and compiles the whole Next.js app a SECOND time on every deploy --
# these args are baked into ENV in the builder stage, so they are part of
# that key even though the worker never serves a browser bundle. Anchoring
# the block makes the two builds identical by construction rather than by
# somebody remembering to edit both copies.
#
# `target` is explicit and load-bearing. With no target, Docker builds the
# LAST stage in the Dockerfile. `runtime` is last today, but a stage appended
# below it would silently become what ships here -- that exact mistake once
# put Chromium in the web image and took prod down.
x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  target: runtime
  args:
    NEXT_PUBLIC_OPENOBSERVE_CLIENT_TOKEN: ${NEXT_PUBLIC_OPENOBSERVE_CLIENT_TOKEN}
    NEXT_PUBLIC_OPENOBSERVE_APPLICATION_ID: ${NEXT_PUBLIC_OPENOBSERVE_APPLICATION_ID:-relay-app}
    NEXT_PUBLIC_OPENOBSERVE_SITE: ${NEXT_PUBLIC_OPENOBSERVE_SITE}
    NEXT_PUBLIC_OPENOBSERVE_ORG: ${NEXT_PUBLIC_OPENOBSERVE_ORG}
    NEXT_PUBLIC_OPENOBSERVE_SERVICE: ${NEXT_PUBLIC_OPENOBSERVE_SERVICE:-relay-app}
    NEXT_PUBLIC_OPENOBSERVE_VERSION: ${NEXT_PUBLIC_OPENOBSERVE_VERSION:-0.1.0}

# Container logs are unbounded by default and the deploy target is a single
# VPS; Coolify's scheduled cleanup prunes images, not log files.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-timing: &healthcheck-timing
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 10s

# What every app process needs to reach its own data. The web and the worker
# talk to the same database, the same queue and the same vault key -- a
# mismatch here is a class of bug that only shows up at runtime, so they read
# from one definition.
x-app-env: &app-env
  NODE_ENV: production
  VAULT_KEY: ${VAULT_KEY}
  DATABASE_URL: ${DATABASE_URL}
  DATABASE_TOKEN: ${DATABASE_TOKEN}
  REDIS_URL: redis://dragonfly:6379
  OPENOBSERVE_URL: ${OPENOBSERVE_URL}
  OPENOBSERVE_ORG: ${OPENOBSERVE_ORG:-default}
  OPENOBSERVE_TOKEN: ${OPENOBSERVE_TOKEN}
  # Egress proxy for sources marked `proxied` in src/lib/media/sources.ts,
  # which today is YouTube only.
  #
  # `warp` is the SERVICE DEFINED BELOW. Compose attaches it to this app's
  # own network and gives it the bare service name as an alias, which is
  # the entire reason this hostname resolves with nothing run by hand.
  #
  # Overridable so this can be pointed at a commercial residential proxy
  # without a code change, and CLEARABLE: set it to "" and every fetch goes
  # direct again, which is the rollback for the whole feature.
  #
  # The WORKER is what actually downloads, but both services read one env
  # block by design (see above), so it is defined here rather than on one
  # service -- a split would be a runtime-only bug the moment ingest moved.
  MEDIA_PROXY_URL: ${MEDIA_PROXY_URL-socks5://warp:1080}

services:
  relay:
    build: *app-build
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      <<: *healthcheck-timing
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
    logging: *logging
    environment:
      <<: *app-env
      NEXT_TELEMETRY_DISABLED: "1"
      APP_BASE_URL: ${APP_BASE_URL}
      PORT: "3000"
      HOST: 0.0.0.0
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      NOTION_CLIENT_ID: ${NOTION_CLIENT_ID}
      NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET}
    depends_on:
      dragonfly:
        condition: service_healthy
    volumes:
      - relay_data:/app/data

  # Runs the pipeline out of band so a download/transcription never occupies
  # a request handler. Builds from the same Dockerfile as `relay` rather than
  # reusing a shared tag: Coolify rewrites every service's image to
  # <resource-uuid>_<service>:<sha>, so a hand-pinned `relay-app:latest`
  # would not exist at deploy time.
  worker:
    build: *app-build
    restart: unless-stopped
    command: ["bun", "scripts/worker.ts"]
    # yt-dlp and ffmpeg are spawned as children of this process. Bun as PID 1
    # does not reap orphaned grandchildren, so without an init the container
    # accumulates zombies one run at a time.
    init: true
    # `restart` only covers a worker that exits; this covers one that is
    # still alive but no longer consuming, and is what Coolify reports.
    healthcheck:
      <<: *healthcheck-timing
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:${QUEUE_HEALTH_PORT:-3001}/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
    logging: *logging
    environment:
      <<: *app-env
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-2}
      QUEUE_HEALTH_PORT: ${QUEUE_HEALTH_PORT:-3001}
    depends_on:
      # Not a runtime dependency -- the worker only needs Dragonfly and the
      # database. It waits because `relay` runs `db:migrate` on start, and a
      # worker that picks up a job against an unmigrated schema fails it.
      relay:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      # `warp` is DELIBERATELY ABSENT, and this is not an omission. Only
      # sources flagged `proxied` use it (YouTube); Instagram goes direct.
      # Gating the worker on the tunnel would stop Instagram ingestion
      # every time WARP is unhealthy -- and WARP is free-tier consumer
      # infrastructure that Cloudflare may throttle at any time. A YouTube
      # fetch with the proxy down instead fails as DOWNLOAD_FAILED, which
      # the queue retries on its own (src/lib/media/classify.ts).
    volumes:
      - relay_data:/app/data

  # Redis-compatible queue backend for BullMQ.
  # `--default_lua_flags=allow-undeclared-keys` is REQUIRED: BullMQ's Lua
  # scripts build key names at runtime, which Dragonfly rejects by default
  # with "script tried accessing undeclared key" -- every job fails on the
  # first enqueue without it.
  #
  # Pinned, not `:latest`: Coolify pulls on every deploy, so a floating tag
  # means the queue backend can change underneath a deploy that only touched
  # app code.
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.1
    restart: unless-stopped
    command:
      - "--default_lua_flags=allow-undeclared-keys"
      - "--cluster_mode=emulated"
      - "--lock_on_hashtags"
    ulimits:
      memlock: -1
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging: *logging
    volumes:
      - dragonfly_data:/data

  # Cloudflare's own `warp-svc` daemon with gost exposing SOCKS5 on 1080 --
  # the non-datacenter egress that YouTube fetches are routed through.
  # Consumed as `MEDIA_PROXY_URL` above; see EGRESS_PROXY.md for the
  # measurements this exists for.
  #
  # WHY IT IS A SERVICE HERE. Compose puts every service in this file on the
  # app's own network and aliases it by service name, so `socks5://warp:1080`
  # resolves for free. As a standalone Coolify resource it landed on
  # Coolify's SHARED network instead, where the app cannot see it, and
  # `--network` in Custom Docker Run Options is silently dropped -- so it
  # only ever worked because somebody ran `docker network connect --alias
  # warp` by hand, and every redeploy of the proxy silently undid that and
  # took YouTube ingestion with it.
  #
  # Putting the APP on the shared network is the other direction and is
  # REJECTED: `dragonfly` below runs with an empty requirepass, so that
  # would expose the job queue to every other container on the host.
  # Attaching warp inward is the narrow direction -- warp holds no secrets.
  #
  # Pinned, like `dragonfly`: `latest` here would mean the thing every
  # YouTube fetch traverses can change under a deploy that only touched app
  # code. This tag is the one the measurements in EGRESS_PROXY.md §1 were
  # taken on.
  warp:
    image: caomingjun/warp:2026.7.1377.0-2.12.0
    restart: unless-stopped
    # NO `ports:`, and that is load-bearing. gost auto-detects HTTP on the
    # same listener it serves SOCKS5 on, so publishing 1080 on a public VPS
    # is an OPEN RELAY for anyone who scans the host. `expose` documents the
    # port without opening it: the worker reaches it over the app network by
    # service alias, and nothing off that network can.
    #
    # For the same reason this service must never be given a domain --
    # Coolify offers one from the server wildcard.
    expose:
      - "1080"
    # Both required by the image to bring up its own WireGuard interface:
    # MKNOD to create /dev/net/tun (with the device rule that permits it,
    # 10:200 being the TUN major:minor) and NET_ADMIN to configure the
    # interface and its routes. AUDIT_WRITE is what warp-svc's dbus layer
    # needs to start. Documented as the required set by the image itself.
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    device_cgroup_rules:
      - "c 10:200 rwm"
    sysctls:
      # WireGuard marks its own packets and routes on that mark; without
      # this the kernel discards the replies as martians, and the symptom is
      # a tunnel that comes up and carries nothing. The image documents it
      # as required and it is why NET_ADMIN alone is not enough.
      #
      # The image also documents `net.ipv6.conf.all.disable_ipv6=0`,
      # deliberately NOT set: Docker refuses to start a container whose
      # sysctl the kernel does not expose, so on a host booted with IPv6
      # off that line is the difference between "no IPv6 egress" and "no
      # egress at all". Nothing here needs IPv6 -- yt-dlp reaches YouTube
      # over v4 through the tunnel either way.
      net.ipv4.conf.all.src_valid_mark: "1"
    environment:
      # Seconds the entrypoint waits for warp-svc to settle before it
      # connects. The image's own default; named here so it is a knob and
      # not a mystery if registration ever races on a slow boot.
      WARP_SLEEP: "2"
    # Proves the TUNNEL, not the listener. A `nc -z 1080` passes while gost
    # is up and WARP is disconnected, which is precisely the state that
    # fails every YouTube run -- so this makes a real request THROUGH the
    # SOCKS port and requires Cloudflare to answer that the traffic arrived
    # over WARP. Anything less would report healthy during an outage.
    #
    # Timings are its own, not the shared anchor: first boot has to enrol a
    # device before any of this can pass, and the probe is a full TLS round
    # trip over a consumer tunnel rather than a loopback fetch.
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS --max-time 10 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace | grep -qE '^warp=(on|plus)'"
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    logging: *logging
    # The device registration. Free WARP enrols anonymously on first start
    # and writes its identity here; on a fresh volume it enrols again and
    # gets a DIFFERENT exit address. Named so that a restart keeps the
    # address it was measured on instead of rolling the dice -- and so that
    # the documented recovery from a blocked exit (drop the registration,
    # restart, re-enrol) stays a deliberate act rather than the default.
    #
    # No secret of ours is in here: there is no account and no license key.
    volumes:
      - warp_data:/var/lib/cloudflare-warp

volumes:
  relay_data:
  dragonfly_data:
  warp_data:
