services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      APP_BASE_URL: ${APP_BASE_URL}
      PORT: "3000"
      HOST: 0.0.0.0
      VAULT_KEY: ${VAULT_KEY}
      DATABASE_URL: file:/app/data/local.db
      NOTION_CLIENT_ID: ${NOTION_CLIENT_ID}
      NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET}
      OPENOBSERVE_URL: ${OPENOBSERVE_URL}
      OPENOBSERVE_ORG: ${OPENOBSERVE_ORG:-default}
      OPENOBSERVE_USER: ${OPENOBSERVE_USER}
      OPENOBSERVE_TOKEN: ${OPENOBSERVE_TOKEN}
    volumes:
      - relay_data:/app/data

  drizzle-studio:
    image: ghcr.io/drizzle-team/gateway:latest
    restart: unless-stopped
    ports:
      - "4983:4983"
    environment:
      PORT: "4983"
      STORE_PATH: /app
      MASTERPASS: ${SERVICE_PASSWORD_DRIZZLE_GATEWAY}
    depends_on:
      relay:
        condition: service_healthy
    volumes:
      - drizzle_gateway:/app
      - relay_data:/databases:ro

volumes:
  relay_data:
  drizzle_gateway:
