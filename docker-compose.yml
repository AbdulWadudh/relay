# Shared fragments. `x-` keys are ignored by Docker and exist only to be
# anchored into the services below.

# ONE build definition for both app services, and that is the point.
#
# `relay` and `worker` run the same image from the same Dockerfile. If their
# build blocks drift by so much as one arg, Docker computes a different cache
# key and compiles the whole Next.js app a SECOND time on every deploy --
# these args are baked into ENV in the builder stage, so they are part of
# that key even though the worker never serves a browser bundle. Anchoring
# the block makes the two builds identical by construction rather than by
# somebody remembering to edit both copies.
#
# `target` is explicit and load-bearing. With no target, Docker builds the
# LAST stage in the Dockerfile. `runtime` is last today, but a stage appended
# below it would silently become what ships here -- that exact mistake once
# put Chromium in the web image and took prod down.
x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  target: runtime
  args:
    NEXT_PUBLIC_OPENOBSERVE_CLIENT_TOKEN: ${NEXT_PUBLIC_OPENOBSERVE_CLIENT_TOKEN}
    NEXT_PUBLIC_OPENOBSERVE_APPLICATION_ID: ${NEXT_PUBLIC_OPENOBSERVE_APPLICATION_ID:-relay-app}
    NEXT_PUBLIC_OPENOBSERVE_SITE: ${NEXT_PUBLIC_OPENOBSERVE_SITE}
    NEXT_PUBLIC_OPENOBSERVE_ORG: ${NEXT_PUBLIC_OPENOBSERVE_ORG}
    NEXT_PUBLIC_OPENOBSERVE_SERVICE: ${NEXT_PUBLIC_OPENOBSERVE_SERVICE:-relay-app}
    NEXT_PUBLIC_OPENOBSERVE_VERSION: ${NEXT_PUBLIC_OPENOBSERVE_VERSION:-0.1.0}

# Container logs are unbounded by default and the deploy target is a single
# VPS; Coolify's scheduled cleanup prunes images, not log files.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-timing: &healthcheck-timing
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 10s

# What every app process needs to reach its own data. The web and the worker
# talk to the same database, the same queue and the same vault key -- a
# mismatch here is a class of bug that only shows up at runtime, so they read
# from one definition.
x-app-env: &app-env
  NODE_ENV: production
  VAULT_KEY: ${VAULT_KEY}
  DATABASE_URL: ${DATABASE_URL}
  DATABASE_TOKEN: ${DATABASE_TOKEN}
  REDIS_URL: redis://dragonfly:6379
  OPENOBSERVE_URL: ${OPENOBSERVE_URL}
  OPENOBSERVE_ORG: ${OPENOBSERVE_ORG:-default}
  OPENOBSERVE_TOKEN: ${OPENOBSERVE_TOKEN}
  # Egress proxy for sources marked `proxied` in src/lib/media/sources.ts,
  # which today is YouTube only.
  #
  # `warp` is NOT a service in this file. It is a separate Coolify resource
  # (`warp-egress`), attached to this app's network with the alias `warp`.
  # See EGRESS_PROXY.md -- that attachment is a manual step, and the
  # consequence of getting it wrong is documented there.
  #
  # Overridable so this can be pointed at a commercial residential proxy
  # without a code change, and CLEARABLE: set it to "" and every fetch goes
  # direct again, which is the rollback for the whole feature.
  #
  # The WORKER is what actually downloads, but both services read one env
  # block by design (see above), so it is defined here rather than on one
  # service -- a split would be a runtime-only bug the moment ingest moved.
  MEDIA_PROXY_URL: ${MEDIA_PROXY_URL-socks5://warp:1080}

services:
  relay:
    build: *app-build
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      <<: *healthcheck-timing
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
    logging: *logging
    environment:
      <<: *app-env
      NEXT_TELEMETRY_DISABLED: "1"
      APP_BASE_URL: ${APP_BASE_URL}
      PORT: "3000"
      HOST: 0.0.0.0
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      NOTION_CLIENT_ID: ${NOTION_CLIENT_ID}
      NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET}
    depends_on:
      dragonfly:
        condition: service_healthy
    volumes:
      - relay_data:/app/data

  # Runs the pipeline out of band so a download/transcription never occupies
  # a request handler. Builds from the same Dockerfile as `relay` rather than
  # reusing a shared tag: Coolify rewrites every service's image to
  # <resource-uuid>_<service>:<sha>, so a hand-pinned `relay-app:latest`
  # would not exist at deploy time.
  worker:
    build: *app-build
    restart: unless-stopped
    command: ["bun", "scripts/worker.ts"]
    # yt-dlp and ffmpeg are spawned as children of this process. Bun as PID 1
    # does not reap orphaned grandchildren, so without an init the container
    # accumulates zombies one run at a time.
    init: true
    # `restart` only covers a worker that exits; this covers one that is
    # still alive but no longer consuming, and is what Coolify reports.
    healthcheck:
      <<: *healthcheck-timing
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:${QUEUE_HEALTH_PORT:-3001}/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
    logging: *logging
    environment:
      <<: *app-env
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-2}
      QUEUE_HEALTH_PORT: ${QUEUE_HEALTH_PORT:-3001}
    depends_on:
      # Not a runtime dependency -- the worker only needs Dragonfly and the
      # database. It waits because `relay` runs `db:migrate` on start, and a
      # worker that picks up a job against an unmigrated schema fails it.
      relay:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    volumes:
      - relay_data:/app/data

  # Redis-compatible queue backend for BullMQ.
  # `--default_lua_flags=allow-undeclared-keys` is REQUIRED: BullMQ's Lua
  # scripts build key names at runtime, which Dragonfly rejects by default
  # with "script tried accessing undeclared key" -- every job fails on the
  # first enqueue without it.
  #
  # Pinned, not `:latest`: Coolify pulls on every deploy, so a floating tag
  # means the queue backend can change underneath a deploy that only touched
  # app code.
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.1
    restart: unless-stopped
    command:
      - "--default_lua_flags=allow-undeclared-keys"
      - "--cluster_mode=emulated"
      - "--lock_on_hashtags"
    ulimits:
      memlock: -1
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging: *logging
    volumes:
      - dragonfly_data:/data

volumes:
  relay_data:
  dragonfly_data:
